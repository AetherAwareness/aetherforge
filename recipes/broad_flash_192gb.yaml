# Broad multi-sector Flash-0731 train — sized for ~2×96GB (192GB) Vast
#
# posture: broad  → ~28% expert slots, top-N sectors, multi-domain mix,
#                   attention LoRA, more steps, lighter specialization loss
#
#   aetherforge train -c configs/base.yaml -c configs/deepseek_v4_flash.yaml \
#     -c recipes/broad_flash_192gb.yaml --dry-run
#   aetherforge remote launch --exec -c configs/base.yaml \
#     -c configs/deepseek_v4_flash.yaml -c recipes/broad_flash_192gb.yaml

training:
  posture: broad
  method: esft_lora
  backend: peft
  lora_r: 64
  lora_alpha: 128
  lora_dropout: 0.0
  include_attention: true
  mask_unselected_experts: true
  max_steps: 1000
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 32
  learning_rate: 8.0e-5
  specialization_loss_weight: 0.04
  load_balance_loss_weight: 0.025
  router_hygiene_steps: 350
  stages: [diagnostics, data, affinity, groups, esft, router_hygiene, scorecard, package]

affinity:
  probe_size: 1536
  top_k_fraction: 0.28
  progressive_unfreeze: true
  freeze_router_initially: true
  multi_theme_probes: true

groups:
  enabled: true
  target_num_groups: 12
  train_scope: top_n
  train_top_n: 6
  strategy: active_slots
  use_for_training: true
  total_params_b: 284
  active_params_b: 13

data:
  domain: multi
  description: "Broad multi-domain specialist mix (product + ops + tools + general)"
  domains:
    - aether_public
    - logistics
    - tools_agents
    - product_ops
    - code_software
  # Real corpora mixed in (paths resolved on the train host)
  mix_paths:
    - /home/trinity/aether_data/training/public-aether-dataset.chat.jsonl
  mix_max_per_source: 2000
  curated_path: /home/trinity/aether_data/training/public-aether-dataset.chat.jsonl
  eval_path: /home/trinity/aether_data/training/public-aether-eval.jsonl
  synthetic:
    enabled: true
    num_samples: 6000
    trajectory_hive: true
  quality_gates:
    min_diversity: 0.40
    min_length: 40
  max_train_samples: 12000
  curriculum: true

eval:
  num_eval_samples: 256
  scorecard_thresholds:
    domain_score: 0.68
    general_delta_max: -0.06
    routing_entropy_min: 1.3
    load_balance_cv_max: 2.2

run:
  name: broad-flash-0731-192gb
