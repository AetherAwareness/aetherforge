name: ci
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest tests/ -q --tb=short
      - name: Groups preview smoke
        run: python -m aetherforge.cli groups --preview --family deepseek_v4_flash --num-groups 8
      - name: Dry-run + pack-eval smoke
        run: |
          python -m aetherforge.cli train --recipe dryrun --dry-run --quiet
          python -m aetherforge.cli eval --recipe dryrun --dry-run
          python -m aetherforge.cli thd --recipe dryrun --dry-run --out /tmp/af-thd.jsonl
      - name: Validate named recipes
        run: |
          python -m aetherforge.cli validate --recipe dryrun
          python -m aetherforge.cli validate --recipe qwen38-27b
          python -m aetherforge.cli validate --recipe broad-flash
          python -m aetherforge.cli validate --recipe a3b-logistics
