# Qwen A3B-class specialist training (primary local iteration path)
model:
  name: "Qwen/Qwen3-30B-A3B"
  family: qwen_a3b
  load_in_4bit: true
  max_seq_length: 8192
  num_experts: 128
  num_experts_per_tok: 8

training:
  method: esft_lora
  backend: unsloth
  lora_r: 64
  lora_alpha: 128
  max_steps: 200
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 1.5e-4

affinity:
  top_k_experts: 24
  probe_size: 512
  use_gradient_contribution: true

run:
  name: qwen-a3b-specialist
