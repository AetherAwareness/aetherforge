# Qwen3.8-27B official HF — DENSE VL, not sparse MoE.
# Live QLoRA belongs on a rented GPU (Vast / RunPod). Local = dry-run.
# Optional: set model.local_path to a downloaded HF tree, or
#   -o model.local_path=/path/to/Qwen3.8-27B
#
#   aetherforge train --recipe qwen38-27b --dry-run
#   aetherforge remote launch --exec --recipe qwen38-27b

model:
  name: "Qwen/Qwen3.8-27B"
  family: qwen38_dense
  load_in_4bit: true
  max_seq_length: 8192
  num_experts: 1
  num_experts_per_tok: 1
  trust_remote_code: true

groups:
  enabled: false
  use_for_training: false

affinity:
  multi_theme_probes: false
  probe_size: 64
  top_k_experts: 0

training:
  method: qlora
  posture: specialist
  backend: peft
  sector_mode: joint
  mask_unselected_experts: false
  include_attention: true
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  max_steps: 200
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 8e-5
  stages:
    - diagnostics
    - data
    - preference
    - scorecard
    - package

providers:
  use_llm_for_thd: false

run:
  name: qwen38-27b-dense-peft
  dry_run: false
